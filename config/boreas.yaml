/**:                                               #GNSS cycle 5Hz, IMU cycle 50Hz.
  ros__parameters:
    output_bag: "boreas_bag"
    bag_duration_sec: 30.0        # 0 = full sequence; e.g. 300.0 for 5 minutes
    storage_id: "sqlite3"
    lidar_downsample_stride: 1      # 1=full resolution, 2=half points (helps RViz keep ~10 Hz)
    pointcloud_topic: "/boreas/pointcloud"
    image_topic: "/boreas/image/compressed"  # sensor_msgs/CompressedImage in bag
    image_compression_format: "png"  # png: store source PNG bytes; jpeg: re-encode
    jpeg_quality: 90
    camera_info_topic: "/boreas/camera_info"
    clock_topic: "/clock"
    lidar_ground_truth_topic: "/boreas/ground_truth/lidar_odom"
    camera_ground_truth_topic: "/boreas/ground_truth/camera_odom"
    gnss_topic: "/boreas/gnss/fix"
    ground_truth_parent_frame: "map"
    write_ground_truth: true
    write_tf: true
    write_gnss: true
  # image size
    width: 2448
    height: 2048
    # focal length
    k0: 1436.89437780124
    k4: 1442.58498490709
    # principal_points
    k2: 1218.77863491507
    k5: 1045.77362896196
    # radial_distortion
    radial_distortion: [0.0144210402954516,-0.0148287624062537]
    tangential_distortion: [0.000000,0.000000]
    skew: 0.000000
    roi: [0,0,2447,2047]
